[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-query-analyzer"
description = "Analytics Query Analyzer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlglot>=28",
]
dynamic = ["version"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
pythonpath = ["src"]
